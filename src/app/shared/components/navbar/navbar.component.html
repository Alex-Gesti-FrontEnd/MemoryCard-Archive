<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container">
    <a class="navbar-brand d-flex align-items-center gap-2" routerLink="/" (click)="closeMenu()">
      <img src="assets/logo_icon.png" alt="logo" height="60" />
      <span>MemoryCard Archive</span>
    </a>

    <button
      class="navbar-toggler"
      type="button"
      (click)="toggleMenu()"

    @if (authService.isLoggedIn()) {
      <div class="collapse navbar-collapse" [class.show]="menuOpen()">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item d-flex align-items-center gap-3 mx-3">
            <span class="navbar-text">
              {{ authService.userName() || 'Player' }}
            </span>
            <button class="btn btn-outline-danger btn-sm" (click)="logout()">Logout</button>
          </li>
          <li class="nav-item">
            <a
              class="nav-link"
              routerLink="/"
              routerLinkActive="active"
              [routerLinkActiveOptions]="{ exact: true }"
              (click)="closeMenu()"
            >
              Home
            </a>
          </li>

          <li class="nav-item">
            <a
              class="nav-link"
              routerLink="/collection"
              routerLinkActive="active"
              (click)="closeMenu()"
            >
              Collection
            </a>
          </li>

          <li class="nav-item">
            <a class="nav-link" routerLink="/map" routerLinkActive="active" (click)="closeMenu()">
              Map
            </a>
          </li>

          <li class="nav-item">
            <a
              class="nav-link"
              routerLink="/calendar"
              routerLinkActive="active"
              (click)="closeMenu()"
            >
              Calendar
            </a>
          </li>

          <li class="nav-item">
            <a
              class="nav-link"
              routerLink="/graphics"
              routerLinkActive="active"
              (click)="closeMenu()"

              Graphics
